<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>星際太空防衛戰 - 比與比例式</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700&family=Fredoka:wght@400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        :root {
            --space-bg: #0b0f19;
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --card-space: rgba(20, 27, 45, 0.85);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Fredoka', 'Chiron GoRound TC', sans-serif;
            height: 100vh; height: 100dvh; overflow: hidden;
            background: #060913; color: #fff;
            display: flex; justify-content: center; align-items: center;
        }

        /* 太空星雲背景 */
        .stars-bg {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden; z-index: 0;
        }
        .star {
            position: absolute; background: #fff; border-radius: 50%; opacity: 0.8;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        #game-container {
            width: 92%; max-width: 980px; height: 88vh; height: 88dvh;
            background: var(--card-space); border-radius: 24px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); display: flex; flex-direction: column;
            position: relative; z-index: 10; overflow: hidden; border: 2px solid var(--neon-blue);
            backdrop-filter: blur(10px);
        }

        /* 頂部 HUD */
        .hud-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background: rgba(10, 15, 30, 0.9); border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            font-family: 'Orbitron', sans-serif;
        }
        .hud-item { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; }
        .shield-bar-bg { width: 120px; height: 14px; background: #1a233a; border-radius: 8px; overflow: hidden; border: 1px solid var(--neon-blue); }
        .shield-bar-fill { height: 100%; background: linear-gradient(90deg, #00f0ff, #00ff66); width: 100%; transition: width 0.3s; }

        /* 太空射擊區域 */
        .space-stage {
            flex: 1; display: flex; flex-direction: column; justify-content: space-between;
            padding: 16px 24px; overflow-y: auto; position: relative;
        }

        .radar-area {
            display: flex; justify-content: space-between; align-items: center;
            min-height: 140px; position: relative;
        }
        .space-ship {
            font-size: 4.5rem; filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.6));
            transition: transform 0.2s;
        }
        .space-ship.fire { transform: translateX(20px) scale(1.1); }
        .enemy-target {
            font-size: 5rem; filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.6));
            animation: hover-alien 2s infinite ease-in-out;
        }
        .enemy-target.explode { animation: explode-effect 0.5s forwards; }

        @keyframes hover-alien { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes explode-effect { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); filter: brightness(3); } 100% { transform: scale(0); opacity: 0; } }

        /* 雷射光束 */
        .laser-beam {
            position: absolute; height: 6px; background: #00f0ff; box-shadow: 0 0 10px #00f0ff, 0 0 20px #fff;
            border-radius: 4px; z-index: 5;
        }

        /* 題目雷達卡片 */
        .radar-card {
            background: rgba(15, 23, 42, 0.95); border: 2px solid var(--neon-blue);
            border-radius: 20px; padding: 16px 20px; text-align: center; margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }
        .question-text { font-size: 1.5rem; color: #fff; margin: 6px 0 12px 0; font-weight: bold; line-height: 1.5; }
        
        #options-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .option-btn {
            background: rgba(30, 41, 59, 0.8); border: 2px solid #334155; color: #e2e8f0;
            padding: 12px 18px; border-radius: 16px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; transition: 0.15s; display: flex; justify-content: space-between; align-items: center;
        }
        .option-btn:hover:not(.locked) { border-color: var(--neon-blue); background: rgba(0, 240, 255, 0.15); transform: translateY(-2px); box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
        .option-btn.correct { background: rgba(0, 255, 102, 0.3) !important; border-color: var(--neon-green) !important; color: #00ff66 !important; }
        .option-btn.wrong { background: rgba(255, 0, 127, 0.3) !important; border-color: var(--neon-pink) !important; color: #ff007f !important; }
        .option-btn.locked { cursor: default; opacity: 0.5; }
        .option-btn.locked.correct { opacity: 1; }

        .katex { font-size: 1.15em !important; color: var(--neon-blue); font-weight: bold; }

        /* 導航按鈕 */
        .bottom-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .btn {
            background: var(--neon-blue); color: #060913; border: none; padding: 10px 22px; font-size: 1.1rem;
            border-radius: 12px; font-weight: bold; cursor: pointer; font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); transition: 0.15s;
        }
        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

        /* 彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(6px); padding: 16px;
        }
        .modal-box {
            background: #0f172a; border: 2px solid var(--neon-blue); border-radius: 24px;
            padding: 28px 24px; text-align: center; max-width: 360px; width: 90%;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            #game-container { height: 96vh; height: 96dvh; width: 96%; }
            .hud-bar { padding: 8px 14px; font-size: 0.85rem; }
            .shield-bar-bg { width: 80px; }
            .space-ship, .enemy-target { font-size: 3.8rem; }
            .question-text { font-size: 1.3rem; }
            #options-list { grid-template-columns: 1fr; gap: 8px; }
            .option-btn { padding: 10px 14px; font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <!-- 星空裝飾 -->
    <div class="stars-bg" id="stars-container"></div>

    <div id="game-container">
        <!-- 頂部 HUD -->
        <div class="hud-bar">
            <div class="hud-item">
                <span>🛡️ 能量護盾</span>
                <div class="shield-bar-bg">
                    <div class="shield-bar-fill" id="shield-fill"></div>
                </div>
                <span id="shield-text" style="font-size: 0.9rem;">100%</span>
            </div>
            <div class="hud-item" style="color: var(--neon-yellow);">
                <span>⭐ SCORE:</span> <span id="score-val">0</span>
            </div>
        </div>

        <!-- 戰鬥主舞台 -->
        <div class="space-stage">
            <div class="radar-area">
                <div class="space-ship" id="hero-ship">🚀</div>
                <div style="font-family: 'Orbitron'; font-size: 1.5rem; color: var(--neon-blue);" id="combo-hud">COMBO x<span id="combo-val">0</span></div>
                <div class="enemy-target" id="alien-target">👾</div>
            </div>

            <!-- 雷達題目卡 -->
            <div class="radar-card">
                <div style="color: var(--neon-blue); font-family: 'Orbitron'; font-size: 0.88rem; letter-spacing: 2px;">
                    MISSION TARGET [<span id="q-index">1</span>/10]
                </div>
                <div class="question-text" id="q-text">目標鎖定中...</div>
                <div style="display:flex; justify-content:center; gap:8px;">
                    <button class="btn" style="padding:4px 12px; font-size:0.85rem;" onclick="playQuestionAudio()">🔊 語音通訊</button>
                </div>
            </div>

            <div id="options-list"></div>
            <div id="feedback-msg" style="text-align: center; height: 26px; font-weight: bold; color: var(--neon-pink); margin-top: 6px;"></div>

            <div class="bottom-nav">
                <button class="btn" style="background:#334155; color:#fff;" onclick="prevQuestion()" id="prev-btn">◀ PREV</button>
                <button class="btn" onclick="nextQuestion()" id="next-btn" disabled>NEXT ▶</button>
            </div>
        </div>
    </div>

    <!-- 登入 Modal -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size: 3.5rem; margin-bottom: 10px;">🚀</div>
            <h2 style="color: var(--neon-blue); margin-top: 0; font-family: 'Orbitron';">STARFLEET DEFENSE</h2>
            <p style="color: #94a3b8; margin-bottom: 18px;">請輸入艦長代號，啟動星艦武器系統！</p>
            <input type="text" id="player-name-input" placeholder="請輸入艦長名稱" style="width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--neon-blue); background: #060913; color: #fff; font-size: 1.15rem; margin-bottom: 18px; text-align: center;">
            <button class="btn" onclick="loginAndStart()" style="width: 100%;">啟動戰艦 ⚡</button>
        </div>
    </div>

    <!-- 結算 Modal -->
    <div id="result-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div style="font-size: 4rem; margin-bottom: 10px;">🪐</div>
            <h2 id="result-title" style="color: var(--neon-yellow); margin-top: 0;">星域防衛成功！</h2>
            <p id="result-desc" style="color: #cbd5e1; margin-bottom: 20px; line-height: 1.5;"></p>
            <button class="btn" onclick="location.reload()" style="width: 100%;">再次出航 ↻</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "若小明有 $5$ 元，小華有 $8$ 元，則小明與小華錢數的「比」為何？", ans: "$5:8$", options: ["$5:8$", "$8:5$", "$\\frac{5}{8}$", "$\\frac{8}{5}$"] },
            { q: "將比 $10:15$ 化為「最簡整數比」為何？", ans: "$2:3$", options: ["$10:15$", "$5:3$", "$2:3$", "$3:2$"] },
            { q: "求比 $4:5$ 的「比值」是多少？", ans: "$\\frac{4}{5}$", options: ["$\\frac{5}{4}$", "$\\frac{4}{5}$", "$4$", "$5$"] },
            { q: "將 $0.3:0.9$ 化為最簡整數比為何？", ans: "$1:3$", options: ["$3:9$", "$30:90$", "$1:3$", "$0.1:0.3$"] },
            { q: "重量 $200$ 克對 $1$ 公斤的比，化為最簡整數比為何？", ans: "$1:5$", options: ["$200:1$", "$2:1$", "$1:5$", "$5:1$"] },
            { q: "若 $x:3 = 4:6$，則 $x$ 之值為何？", ans: "$2$", options: ["$1$", "$2$", "$3$", "$4$"] },
            { q: "計算比值：$12:4$。", ans: "$3$", options: ["$\\frac{1}{3}$", "$3$", "$12$", "$4$"] },
            { q: "將 $\\frac{1}{2} : \\frac{1}{4}$ 化為最簡整數比為何？", ans: "$2:1$", options: ["$1:2$", "$2:1$", "$4:2$", "$1:4$"] },
            { q: "若 $a:b = 7:3$，則下列敘述何者錯誤？", ans: "比值是 $\\frac{3}{7}$", options: ["比的前項是 $7$", "比的後項是 $3$", "比值是 $\\frac{7}{3}$", "比值是 $\\frac{3}{7}$"] },
            { q: "將 $1.5:3$ 化為最簡整數比為何？", ans: "$1:2$", options: ["$15:30$", "$1:2$", "$3:6$", "$2:1$"] }
        ];

        const alienAvatars = ["👾", "🛸", "☄️", "🤖", "🐙", "🛰️"];

        let playerName = "";
        let shield = 100;
        let score = 0;
        let combo = 0;
        let currentQIndex = 0;
        let qList = [];
        let questionStates = [];

        // 生成星空
        const starsBox = document.getElementById('stars-container');
        for(let i = 0; i < 40; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsBox.appendChild(star);
        }

        function loginAndStart() {
            const name = document.getElementById('player-name-input').value.trim();
            if (!name) return alert("請輸入艦長名稱！");
            playerName = name;
            document.getElementById('login-modal').classList.add('hidden');
            initGame();
        }

        function initGame() {
            qList = [...questions].sort(() => Math.random() - 0.5);
            questionStates = new Array(qList.length).fill(null);
            currentQIndex = 0;
            score = 0; shield = 100; combo = 0;
            updateHUD();
            loadQuestion();
        }

        function updateHUD() {
            document.getElementById('shield-fill').style.width = Math.max(0, shield) + "%";
            document.getElementById('shield-text').innerText = Math.max(0, shield) + "%";
            document.getElementById('score-val').innerText = score;
            document.getElementById('combo-val').innerText = combo;
        }

        function formatMath(text) {
            if (!window.katex) return text;
            return text.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math.trim(), { throwOnError: false }); } catch(e) { return m; }
            });
        }

        function loadQuestion() {
            const q = qList[currentQIndex];
            const state = questionStates[currentQIndex];

            document.getElementById('q-index').innerText = currentQIndex + 1;
            document.getElementById('q-text').innerHTML = formatMath(q.q);
            document.getElementById('feedback-msg').innerText = state ? (state.isCorrect ? "🎯 目標擊毀！" : "⚠️ 護盾受損！") : "";
            document.getElementById('alien-target').innerText = alienAvatars[currentQIndex % alienAvatars.length];
            document.getElementById('alien-target').classList.remove('explode');

            const list = document.getElementById('options-list');
            list.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = "option-btn";
                btn.innerHTML = `<span>${formatMath(opt)}</span><span onclick="event.stopPropagation(); speak('${opt.replace(/\$/g,'')}')">🔊</span>`;
                
                if (state) {
                    btn.classList.add('locked');
                    if (opt === q.ans) btn.classList.add('correct');
                    else if (opt === state.selected && !state.isCorrect) btn.classList.add('wrong');
                } else {
                    btn.onclick = () => fireLaser(opt, q.ans, btn);
                }
                list.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = (currentQIndex === 0);
            document.getElementById('next-btn').disabled = !state;
        }

        function fireLaser(selected, correct, btnEl) {
            if (questionStates[currentQIndex]) return;
            const isCorrect = (selected === correct);
            questionStates[currentQIndex] = { isCorrect, selected };
            document.getElementById('next-btn').disabled = false;

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.add('locked'));

            const ship = document.getElementById('hero-ship');
            const alien = document.getElementById('alien-target');

            if (isCorrect) {
                btnEl.classList.add('correct');
                combo++;
                score += 100 * combo;
                playSound('laser');

                ship.classList.add('fire');
                setTimeout(() => ship.classList.remove('fire'), 250);

                setTimeout(() => {
                    alien.classList.add('explode');
                    playSound('explode');
                }, 150);
            } else {
                btnEl.classList.add('wrong');
                combo = 0;
                shield -= 20;
                playSound('hit');

                if (shield <= 0) {
                    shield = 0;
                    setTimeout(() => showResult(false), 500);
                }
            }
            updateHUD();
        }

        function nextQuestion() {
            if (currentQIndex < qList.length - 1) {
                currentQIndex++; loadQuestion();
            } else {
                showResult(shield > 0);
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--; loadQuestion();
            }
        }

        function showResult(isWin) {
            const modal = document.getElementById('result-modal');
            document.getElementById('result-title').innerText = isWin ? "星域保衛成功！🏆" : "戰艦護盾崩潰！💥";
            document.getElementById('result-desc').innerHTML = isWin
                ? `艦長 ${playerName}！你成功消滅所有外星艦隊，總得分：<b>${score}</b> 分！`
                : `艦隊遭到重創，${playerName} 艦長請重整旗鼓再次出發！`;
            modal.classList.remove('hidden');
        }

        function playQuestionAudio() {
            speak(qList[currentQIndex].q.replace(/\$/g, ''));
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW';
            window.speechSynthesis.speak(u);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'laser') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'explode') {
                osc.type = 'square'; osc.frequency.setValueAtTime(120, now); osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(80, now + 0.2);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }
    </script>
</body>
</html>
