<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RPG 勇者地牢大冒險 - 比與比例式</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700&family=Fredoka:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        :root {
            --bg-dark: #1a1b26;
            --card-dark: #24283b;
            --primary-accent: #ff9e64;
            --hero-color: #7aa2f7;
            --monster-color: #f7768e;
            --gold-color: #e0af68;
            --text-light: #c0caf5;
            --border-radius: 20px;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Fredoka', 'Chiron GoRound TC', sans-serif;
            height: 100vh; height: 100dvh; overflow: hidden;
            background: radial-gradient(circle at center, #24283b 0%, #16161e 100%);
            color: var(--text-light);
            display: flex; justify-content: center; align-items: center;
        }

        #game-container {
            width: 92%; max-width: 1000px; height: 88vh; height: 88dvh;
            background: var(--card-dark); border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column;
            position: relative; overflow: hidden; border: 4px solid #414868;
        }

        /* 頂部狀態資訊條 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: rgba(15, 15, 20, 0.75); border-bottom: 2px solid #414868;
            flex-shrink: 0;
        }
        .hero-stats, .game-stats { display: flex; align-items: center; gap: 14px; font-weight: bold; }
        .hp-bar-container {
            width: 140px; height: 16px; background: #414868; border-radius: 10px; overflow: hidden;
            position: relative; border: 1px solid #565f89;
        }
        .hp-fill { height: 100%; transition: width 0.3s ease-out; }
        .hp-hero { background: linear-gradient(90deg, #7aa2f7, #2ac3de); }
        .hp-monster { background: linear-gradient(90deg, #f7768e, #ff007c); }
        .hp-text { position: absolute; width: 100%; text-align: center; font-size: 0.72rem; line-height: 16px; color: #fff; text-shadow: 1px 1px 2px #000; }

        /* 戰鬥舞台 */
        .battle-stage {
            flex: 1; display: flex; flex-direction: column; justify-content: space-between;
            padding: 14px 20px; position: relative; overflow-y: auto;
        }

        .battle-arena {
            display: flex; justify-content: space-around; align-items: center;
            min-height: 130px; position: relative;
        }
        .character-box {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            position: relative;
        }
        .avatar {
            font-size: 5rem; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
            transition: transform 0.2s;
        }
        .character-box.attack .avatar { transform: scale(1.25) translateY(-10px); }
        .character-box.hit .avatar { animation: shake-hit 0.4s; filter: drop-shadow(0 0 15px #f7768e) hue-rotate(180deg); }

        .damage-number {
            position: absolute; top: -10px; font-size: 2rem; font-weight: bold; color: #ff9e64;
            animation: float-damage 0.8s forwards; text-shadow: 2px 2px 4px #000; pointer-events: none;
        }
        .damage-crit { color: #f7768e; font-size: 2.5rem; text-shadow: 0 0 10px #f7768e; }

        /* 答題卡片 */
        .quiz-card {
            background: #1a1b26; border-radius: 18px; padding: 14px 20px;
            border: 2px solid #565f89; text-align: center; margin-bottom: 12px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }
        .question-text { font-size: 1.45rem; color: #fff; margin: 4px 0 10px 0; font-weight: bold; line-height: 1.5; }
        
        #options-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .option-btn {
            background: #24283b; border: 2px solid #414868; color: #c0caf5; padding: 12px 16px;
            border-radius: 14px; font-size: 1.15rem; font-weight: bold; cursor: pointer; transition: 0.15s;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 3px 0 #16161e;
        }
        .option-btn:hover:not(.locked) { border-color: #7aa2f7; background: #2f354d; transform: translateY(-2px); }
        .option-btn:active:not(.locked) { transform: translateY(2px); box-shadow: none; }
        .option-btn.correct { background: #2e7d32 !important; border-color: #4caf50 !important; color: #fff !important; }
        .option-btn.wrong { background: #c62828 !important; border-color: #f44336 !important; color: #fff !important; animation: shake-hit 0.4s; }
        .option-btn.locked { cursor: default; opacity: 0.5; }
        .option-btn.locked.correct { opacity: 1; }

        .speaker-btn { font-size: 1.2rem; cursor: pointer; padding: 4px; border-radius: 50%; background: #414868; }
        .speaker-btn:hover { background: var(--gold-color); color: #000; }

        /* 導航與功能按鈕 */
        .bottom-nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 10px; }
        .btn {
            background: #7aa2f7; color: #1a1b26; border: none; padding: 10px 20px; font-size: 1.05rem;
            border-radius: 12px; font-weight: bold; cursor: pointer; font-family: inherit;
            box-shadow: 0 4px 0 #3d59a1; transition: 0.15s;
        }
        .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
        .btn-gold { background: #e0af68; box-shadow: 0 4px 0 #a87930; color: #1a1b26; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        .katex { font-size: 1.15em !important; color: #7dcfff; font-weight: bold; }

        /* 彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); padding: 16px;
        }
        .modal-box {
            background: #24283b; border: 3px solid #565f89; border-radius: 20px;
            padding: 26px 20px; text-align: center; max-width: 360px; width: 90%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6); color: #fff;
        }

        .hidden { display: none !important; }

        @keyframes shake-hit { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-8px);} 75% {transform: translateX(8px);} }
        @keyframes float-damage { 0% {opacity: 1; transform: translateY(0) scale(1);} 100% {opacity: 0; transform: translateY(-40px) scale(1.3);} }

        @media (max-width: 768px) {
            #game-container { height: 96vh; height: 96dvh; width: 96%; }
            .top-bar { padding: 8px 12px; font-size: 0.88rem; }
            .hp-bar-container { width: 90px; }
            .avatar { font-size: 4rem; }
            .question-text { font-size: 1.25rem; }
            #options-list { grid-template-columns: 1fr; gap: 8px; }
            .option-btn { padding: 9px 12px; font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 頂部冒險狀態列 -->
        <div class="top-bar">
            <div class="hero-stats">
                <span>🧙‍♂️ 勇者</span>
                <div class="hp-bar-container">
                    <div class="hp-fill hp-hero" id="hero-hp-bar" style="width: 100%;"></div>
                    <span class="hp-text"><span id="hero-hp-text">100</span>/100</span>
                </div>
            </div>
            <div class="game-stats">
                <span>🪙 <span id="gold-val">0</span></span>
                <span>⚔️ 第 <span id="dungeon-level">1</span>/3 層</span>
                <button class="btn btn-gold" onclick="openShop()" style="padding: 4px 10px; font-size: 0.85rem;">🏪 鐵匠鋪</button>
            </div>
        </div>

        <!-- 戰鬥主舞台 -->
        <div class="battle-stage">
            <div class="battle-arena">
                <div class="character-box" id="hero-box">
                    <div class="avatar">🧙‍♂️</div>
                    <div style="font-weight: bold; font-size: 0.95rem; color: #7aa2f7;">勇者小隊</div>
                </div>

                <div style="font-size: 2rem; font-weight: bold; color: #ff9e64;">VS</div>

                <div class="character-box" id="monster-box">
                    <div class="avatar" id="monster-avatar">👾</div>
                    <div style="font-weight: bold; font-size: 0.95rem; color: #f7768e;" id="monster-name">地牢史萊姆</div>
                    <div class="hp-bar-container" style="width: 110px; margin-top: 4px;">
                        <div class="hp-fill hp-monster" id="monster-hp-bar" style="width: 100%;"></div>
                        <span class="hp-text"><span id="monster-hp-text">100</span>/100</span>
                    </div>
                </div>
            </div>

            <!-- 題目區 -->
            <div class="quiz-card">
                <div style="color: #7aa2f7; font-size: 0.88rem; font-weight: bold; letter-spacing: 1px;">
                    SPELL QUESTION <span id="q-index">1</span>
                </div>
                <div class="question-text" id="q-text">題目載入中...</div>
                <div style="display:flex; justify-content:center; gap:8px;">
                    <span class="speaker-btn" onclick="playQuestionAudio()" title="朗讀題幹">🔊 吟唱題目</span>
                </div>
            </div>

            <div id="options-list"></div>
            <div id="feedback-msg" style="text-align: center; height: 24px; font-weight: bold; color: #ff9e64; margin-top: 6px;"></div>

            <div class="bottom-nav">
                <button class="btn" onclick="prevQuestion()" id="prev-btn">◀ 上一題</button>
                <div style="color: #e0af68; font-weight: bold;" id="combo-display">連擊：0 💥</div>
                <button class="btn" onclick="nextQuestion()" id="next-btn" disabled>下一題 ▶</button>
            </div>
        </div>
    </div>

    <!-- 鐵匠鋪 Modal -->
    <div id="shop-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="color: #e0af68; margin-top: 0;">🏪 地牢鐵匠鋪</h2>
            <p style="color: #a9b1d6; font-size: 0.95rem;">花費金幣強化你的魔法與防具！</p>
            <div style="display: flex; flex-direction: column; gap: 10px; margin: 15px 0;">
                <button class="btn" onclick="buyItem('potion')" id="buy-potion-btn">🧪 生命藥水 (+40 HP) - 100 🪙</button>
                <button class="btn" onclick="buyItem('sword')" id="buy-sword-btn">🗡️ 附魔之劍 (+15 攻擊) - 200 🪙</button>
                <button class="btn" onclick="buyItem('shield')" id="buy-shield-btn">🛡️ 秘銀盾牌 (-5 傷害) - 200 🪙</button>
            </div>
            <button class="btn" style="background:#565f89; color:#fff;" onclick="closeShop()">離開鐵匠鋪</button>
        </div>
    </div>

    <!-- 登入 Modal -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size: 3.5rem; margin-bottom: 10px;">⚔️</div>
            <h2 style="color: #7aa2f7; margin-top: 0;">勇者出征！地牢冒險</h2>
            <p style="color: #a9b1d6; margin-bottom: 18px;">請輸入勇者大名，啟動你的冒險紀錄！</p>
            <input type="text" id="player-name-input" placeholder="請輸入勇者名稱" style="width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #565f89; background: #1a1b26; color: #fff; font-size: 1.15rem; margin-bottom: 18px; text-align: center; font-family: inherit;">
            <button class="btn" onclick="loginAndStart()" style="width: 100%;">踏入地牢</button>
        </div>
    </div>

    <!-- 通關 / 戰敗 Modal -->
    <div id="result-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div id="result-icon" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
            <h2 id="result-title" style="color: #e0af68; margin-top: 0;">冒險通關！</h2>
            <p id="result-desc" style="color: #a9b1d6; margin-bottom: 20px; line-height: 1.5;"></p>
            <button class="btn" onclick="location.reload()" style="width: 100%;">再戰一次 ↻</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "若小明有 $5$ 元，小華有 $8$ 元，則小明與小華錢數的「比」為何？", ans: "$5:8$", options: ["$5:8$", "$8:5$", "$\\frac{5}{8}$", "$\\frac{8}{5}$"] },
            { q: "將比 $10:15$ 化為「最簡整數比」為何？", ans: "$2:3$", options: ["$10:15$", "$5:3$", "$2:3$", "$3:2$"] },
            { q: "求比 $4:5$ 的「比值」是多少？", ans: "$\\frac{4}{5}$", options: ["$\\frac{5}{4}$", "$\\frac{4}{5}$", "$4$", "$5$"] },
            { q: "將 $0.3:0.9$ 化為最簡整數比為何？", ans: "$1:3$", options: ["$3:9$", "$30:90$", "$1:3$", "$0.1:0.3$"] },
            { q: "重量 $200$ 克對 $1$ 公斤的比，化為最簡整數比為何？", ans: "$1:5$", options: ["$200:1$", "$2:1$", "$1:5$", "$5:1$"] },
            { q: "若 $x:3 = 4:6$，則 $x$ 之值為何？", ans: "$2$", options: ["$1$", "$2$", "$3$", "$4$"] },
            { q: "計算比值：$12:4$。", ans: "$3$", options: ["$\\frac{1}{3}$", "$3$", "$12$", "$4$"] },
            { q: "將 $\\frac{1}{2} : \\frac{1}{4}$ 化為最簡整數比為何？", ans: "$2:1$", options: ["$1:2$", "$2:1$", "$4:2$", "$1:4$"] },
            { q: "若 $a:b = 7:3$，則下列敘述何者錯誤？", ans: "比值是 $\\frac{3}{7}$", options: ["比的前項是 $7$", "比的後項是 $3$", "比值是 $\\frac{7}{3}$", "比值是 $\\frac{3}{7}$"] },
            { q: "將 $1.5:3$ 化為最簡整數比為何？", ans: "$1:2$", options: ["$15:30$", "$1:2$", "$3:6$", "$2:1$"] }
        ];

        const monsters = [
            { name: "地牢史萊姆", avatar: "👾", maxHp: 100, dmg: 15 },
            { name: "暗影死靈法師", avatar: "💀", maxHp: 120, dmg: 20 },
            { name: "遠古地獄魔龍", avatar: "🐉", maxHp: 150, dmg: 25 }
        ];

        let playerName = "";
        let heroHp = 100;
        let heroMaxHp = 100;
        let heroAttackPower = 35;
        let heroDefense = 0;
        let gold = 0;
        let currentLevel = 0;
        let monsterHp = 100;
        let currentQIndex = 0;
        let qList = [];
        let questionStates = [];
        let combo = 0;

        function loginAndStart() {
            const name = document.getElementById('player-name-input').value.trim();
            if (!name) return alert("請輸入勇者名稱！");
            playerName = name;
            document.getElementById('login-modal').classList.add('hidden');
            initDungeon();
        }

        function initDungeon() {
            qList = [...questions].sort(() => Math.random() - 0.5);
            questionStates = new Array(qList.length).fill(null);
            currentQIndex = 0;
            currentLevel = 0;
            setupMonster(0);
            updateStatsUI();
            loadQuestion();
        }

        function setupMonster(level) {
            const m = monsters[level];
            monsterHp = m.maxHp;
            document.getElementById('monster-avatar').innerText = m.avatar;
            document.getElementById('monster-name').innerText = m.name;
            document.getElementById('dungeon-level').innerText = level + 1;
            updateHpBars();
        }

        function updateHpBars() {
            const curM = monsters[currentLevel];
            document.getElementById('hero-hp-text').innerText = Math.max(0, heroHp);
            document.getElementById('hero-hp-bar').style.width = (heroHp / heroMaxHp * 100) + "%";
            document.getElementById('monster-hp-text').innerText = Math.max(0, monsterHp);
            document.getElementById('monster-hp-bar').style.width = (monsterHp / curM.maxHp * 100) + "%";
        }

        function updateStatsUI() {
            document.getElementById('gold-val').innerText = gold;
            document.getElementById('combo-display').innerText = `連擊：${combo} 💥`;
            updateHpBars();
        }

        function formatMath(text) {
            if (!window.katex) return text;
            return text.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math.trim(), { throwOnError: false }); } catch(e) { return m; }
            });
        }

        function loadQuestion() {
            const q = qList[currentQIndex];
            const state = questionStates[currentQIndex];

            document.getElementById('q-index').innerText = currentQIndex + 1;
            document.getElementById('q-text').innerHTML = formatMath(q.q);
            document.getElementById('feedback-msg').innerText = state ? (state.isCorrect ? "本題施法成功！" : "此題詠唱失敗！") : "";

            const list = document.getElementById('options-list');
            list.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = "option-btn";
                btn.innerHTML = `<span>${formatMath(opt)}</span><span class="speaker-btn" onclick="event.stopPropagation(); speak('${opt.replace(/\$/g,'')}')">🔊</span>`;
                
                if (state) {
                    btn.classList.add('locked');
                    if (opt === q.ans) btn.classList.add('correct');
                    else if (opt === state.selected && !state.isCorrect) btn.classList.add('wrong');
                } else {
                    btn.onclick = () => checkSpell(opt, q.ans, btn);
                }
                list.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = (currentQIndex === 0);
            document.getElementById('next-btn').disabled = !state;
        }

        function checkSpell(selected, correct, btnEl) {
            if (questionStates[currentQIndex]) return;
            const isCorrect = (selected === correct);
            questionStates[currentQIndex] = { isCorrect, selected };
            document.getElementById('next-btn').disabled = false;

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.add('locked'));

            if (isCorrect) {
                btnEl.classList.add('correct');
                combo++;
                gold += 50;
                playSound('attack');

                let dmg = heroAttackPower;
                let isCrit = combo >= 3;
                if (isCrit) dmg = Math.round(dmg * 1.8);

                monsterHp -= dmg;
                showDamage(document.getElementById('monster-box'), `-${dmg}`, isCrit);
                document.getElementById('hero-box').classList.add('attack');
                setTimeout(() => document.getElementById('hero-box').classList.remove('attack'), 300);

                if (monsterHp <= 0) {
                    monsterHp = 0;
                    playSound('win');
                    setTimeout(() => {
                        if (currentLevel < monsters.length - 1) {
                            alert(`🎉 成功擊敗 ${monsters[currentLevel].name}！即將進入下一層！`);
                            currentLevel++;
                            setupMonster(currentLevel);
                        } else {
                            showGameResult(true);
                        }
                    }, 600);
                }
            } else {
                btnEl.classList.add('wrong');
                combo = 0;
                playSound('hit');

                const curM = monsters[currentLevel];
                let monsterDmg = Math.max(5, curM.dmg - heroDefense);
                heroHp -= monsterDmg;
                showDamage(document.getElementById('hero-box'), `-${monsterDmg}`, false);
                document.getElementById('hero-box').classList.add('hit');
                setTimeout(() => document.getElementById('hero-box').classList.remove('hit'), 400);

                if (heroHp <= 0) {
                    heroHp = 0;
                    playSound('lose');
                    setTimeout(() => showGameResult(false), 500);
                }
            }
            updateStatsUI();
        }

        function showDamage(targetEl, text, isCrit) {
            const dmgEl = document.createElement('div');
            dmgEl.className = 'damage-number' + (isCrit ? ' damage-crit' : '');
            dmgEl.innerText = isCrit ? `CRITICAL! ${text}` : text;
            targetEl.appendChild(dmgEl);
            setTimeout(() => dmgEl.remove(), 800);
        }

        function nextQuestion() {
            if (currentQIndex < qList.length - 1) {
                currentQIndex++; loadQuestion();
            } else {
                showGameResult(heroHp > 0);
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--; loadQuestion();
            }
        }

        function showGameResult(isWin) {
            const modal = document.getElementById('result-modal');
            document.getElementById('result-icon').innerText = isWin ? "👑" : "💀";
            document.getElementById('result-title').innerText = isWin ? "勇者傳說誕生！" : "勇者倒下了...";
            document.getElementById('result-desc').innerHTML = isWin 
                ? `恭喜 ${playerName}！你成功斬殺所有地牢魔物，獲得金幣 <b>${gold}</b> 🪙！`
                : `勝敗乃兵家常事，${playerName} 勇者請再接再厲！`;
            modal.classList.remove('hidden');
        }

        function openShop() { document.getElementById('shop-modal').classList.remove('hidden'); }
        function closeShop() { document.getElementById('shop-modal').classList.add('hidden'); }

        function buyItem(item) {
            if (item === 'potion' && gold >= 100) {
                gold -= 100; heroHp = Math.min(heroMaxHp, heroHp + 40);
                playSound('heal'); alert("喝下生命藥水，恢復 40 點生命值！");
            } else if (item === 'sword' && gold >= 200) {
                gold -= 200; heroAttackPower += 15;
                playSound('upgrade'); alert("附魔之劍升級！基礎攻擊力提升至 " + heroAttackPower);
            } else if (item === 'shield' && gold >= 200) {
                gold -= 200; heroDefense += 5;
                playSound('upgrade'); alert("秘銀盾牌強化！受到的傷害減少 5 點！");
            } else {
                alert("金幣不足喔！");
            }
            updateStatsUI();
        }

        function playQuestionAudio() {
            speak(qList[currentQIndex].q.replace(/\$/g, ''));
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW';
            window.speechSynthesis.speak(u);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'attack') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now); osc.frequency.linearRampToValueAtTime(60, now + 0.2);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'heal') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1); osc.frequency.setValueAtTime(783, now + 0.2);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'win') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(659, now + 0.15); osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }
